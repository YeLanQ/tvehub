[package]
# crate 名与应用名（tauri.conf.json 的 productName/mainBinaryName = "TvE Hub"）对齐：
# cargo 构建日志、产物名（tve-hub.exe，tauri build 再改名为 TvE Hub.exe）由此而来
name = "tve-hub"
# 与 tauri.conf.json 的 version 保持一致（产品版本以 tauri.conf.json 为准）
version = "0.1.3+1"
description = "TvE Hub —— 三维可视化编辑器与创意工坊"
authors = ["Tve Team"]
license = "Apache-2.0"
edition = "2021"
# 新增 mcp 独立二进制后需显式指定默认运行目标（tauri dev/build 用）
default-run = "tve-hub"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tve_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：保持 JSON 对象字段顺序（解析→回写不重排，保存文件 diff 最小化）
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.14"
# 构建导出：资产 gzip 归档（flate2 纯 rust 后端）与内联 base64
flate2 = "1"
base64 = "0.22"
# 项目目录文件监听（外部改动 → fs-changed 事件 → 前端失效缓存刷新）
notify = "6"
# 并行计算：资产扫描/导出打包/meta 生成等 IO+CPU 密集任务并行化
rayon = "1"
# 助手 LLM 外呼（OpenAI 兼容 /chat/completions SSE 流式）：rustls 免系统 TLS 依赖
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"


