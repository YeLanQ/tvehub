<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tve 文档</title>
    <style>
      /* 首屏 splash：WebView2 冷启动 + 主包加载/解析期间立即呈现，Vue 挂载后自动替换 */
      html, body { margin: 0; height: 100%; background: #1c1c1c; }
      .boot-splash {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; gap: 14px;
        align-items: center; justify-content: center;
        background: #141414; color: #949494;
        font: 13px/1.4 system-ui, "Segoe UI", sans-serif;
      }
      .boot-spinner {
        width: 30px; height: 30px;
        border-radius: 50%;
        border: 3px solid rgba(210, 210, 210, 0.12);
        border-top-color: #d2d2d2;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="boot-splash">
        <div class="boot-spinner"></div>
        <div class="boot-label">tve 文档</div>
      </div>
    </div>
    <script type="module" src="/src/docs-main.ts"></script>
  </body>
</html>
