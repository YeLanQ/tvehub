<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101014;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #101014;
      }
      #app canvas {
        display: block;
        flex: none;
      }
      #error {
        display: none;
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        color: #ff9a9a;
        font: 12px/1.7 Consolas, monospace;
        white-space: pre-wrap;
        overflow: auto;
        padding: 14px;
        background: #101014;
      }
      #error.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="error"></div>
    <!-- 单页构建：场景/资产/运行时代码（player + libs）由构建流程全部内联注入下方
         占位处（数据脚本 + Blob/importmap 引导脚本），产物只有一个 HTML 文件 -->
    {{BUILD_DATA}}
  </body>
</html>
