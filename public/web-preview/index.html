<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>网页预览</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #101014;
      }
      #app {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #101014;
      }
      #app canvas {
        display: block;
      }
      #error {
        display: none;
        position: fixed;
        inset: 0;
        box-sizing: border-box;
        color: #ff9a9a;
        font: 12px/1.7 Consolas, monospace;
        white-space: pre-wrap;
        overflow: auto;
        padding: 14px;
        background: #101014;
      }
      #error.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="error"></div>
    <script type="module" src="./player.mjs"></script>
  </body>
</html>
